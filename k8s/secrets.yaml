# Voltraak IMS - Secrets (Template)
# Note: Actual secrets should be created separately and not committed to version control

apiVersion: v1
kind: Secret
metadata:
  name: voltraak-backend-secrets
  namespace: voltraak-ims
  labels:
    app: voltraak-backend
type: Opaque
stringData:
  APP_KEY: "base64:CHANGE_THIS_TO_ACTUAL_LARAVEL_APP_KEY"
  DB_USERNAME: "voltraak_user"
  DB_PASSWORD: "CHANGE_THIS_PASSWORD"
  JWT_SECRET: "CHANGE_THIS_JWT_SECRET"
  REDIS_PASSWORD: "CHANGE_THIS_REDIS_PASSWORD"
  MAIL_USERNAME: "noreply@voltraak.com"
  MAIL_PASSWORD: "CHANGE_THIS_MAIL_PASSWORD"

---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: voltraak-ims
  labels:
    app: mysql
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "CHANGE_THIS_ROOT_PASSWORD"
  MYSQL_USER: "voltraak_user"
  MYSQL_PASSWORD: "CHANGE_THIS_PASSWORD"
  MYSQL_DATABASE: "voltraak_ims"

---
# Example of how to create secrets from command line:
# kubectl create secret generic voltraak-backend-secrets \
#   --from-literal=APP_KEY="base64:your-laravel-app-key" \
#   --from-literal=DB_PASSWORD="your-db-password" \
#   --from-literal=JWT_SECRET="your-jwt-secret" \
#   --namespace=voltraak-ims