# Voltraak IMS - React Frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voltraak-frontend
  namespace: voltraak-ims
  labels:
    app: voltraak-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voltraak-frontend
  template:
    metadata:
      labels:
        app: voltraak-frontend
    spec:
      containers:
      - name: frontend
        image: voltraak/frontend:latest
        ports:
        - containerPort: 80
          name: http
        envFrom:
        - configMapRef:
            name: voltraak-frontend-config
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: voltraak-frontend-service
  namespace: voltraak-ims
  labels:
    app: voltraak-frontend
spec:
  selector:
    app: voltraak-frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP