# Voltraak IMS - Laravel Backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voltraak-backend
  namespace: voltraak-ims
  labels:
    app: voltraak-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: voltraak-backend
  template:
    metadata:
      labels:
        app: voltraak-backend
    spec:
      initContainers:
      - name: wait-for-mysql
        image: busybox:latest
        command: ['sh', '-c']
        args:
        - |
          until nc -z mysql-service 3306; do
            echo "Waiting for MySQL..."
            sleep 5
          done
          echo "MySQL is ready!"
      - name: migrate-database
        image: voltraak/backend:latest
        command: ['php', 'artisan', 'migrate', '--force']
        envFrom:
        - configMapRef:
            name: voltraak-backend-config
        - secretRef:
            name: voltraak-backend-secrets
      containers:
      - name: backend
        image: voltraak/backend:latest
        ports:
        - containerPort: 80
          name: http
        envFrom:
        - configMapRef:
            name: voltraak-backend-config
        - secretRef:
            name: voltraak-backend-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]

---
apiVersion: v1
kind: Service
metadata:
  name: voltraak-backend-service
  namespace: voltraak-ims
  labels:
    app: voltraak-backend
spec:
  selector:
    app: voltraak-backend
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP

---
# Queue Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voltraak-queue-worker
  namespace: voltraak-ims
  labels:
    app: voltraak-queue-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voltraak-queue-worker
  template:
    metadata:
      labels:
        app: voltraak-queue-worker
    spec:
      containers:
      - name: queue-worker
        image: voltraak/backend:latest
        command: ['php', 'artisan', 'queue:work']
        args: ['--verbose', '--tries=3', '--timeout=90', '--memory=128']
        envFrom:
        - configMapRef:
            name: voltraak-backend-config
        - secretRef:
            name: voltraak-backend-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command: ['php', 'artisan', 'queue:monitor']
          initialDelaySeconds: 60
          periodSeconds: 60

---
# Scheduler CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: voltraak-scheduler
  namespace: voltraak-ims
  labels:
    app: voltraak-scheduler
spec:
  schedule: "* * * * *" # Every minute
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: scheduler
            image: voltraak/backend:latest
            command: ['php', 'artisan', 'schedule:run']
            envFrom:
            - configMapRef:
                name: voltraak-backend-config
            - secretRef:
                name: voltraak-backend-secrets
            resources:
              requests:
                memory: "64Mi"
                cpu: "50m"
              limits:
                memory: "128Mi"
                cpu: "100m"
          restartPolicy: OnFailure