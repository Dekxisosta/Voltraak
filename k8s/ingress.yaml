# Voltraak IMS - Ingress Configuration
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voltraak-ingress
  namespace: voltraak-ims
  labels:
    app: voltraak
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - voltraak.com
    - www.voltraak.com
    - api.voltraak.com
    secretName: voltraak-tls
  rules:
  - host: voltraak.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: voltraak-frontend-service
            port:
              number: 80
  - host: www.voltraak.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: voltraak-frontend-service
            port:
              number: 80
  - host: api.voltraak.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: voltraak-backend-service
            port:
              number: 80

---
# Certificate Issuer for Let's Encrypt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@voltraak.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx