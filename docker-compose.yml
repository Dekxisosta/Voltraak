services:

  # ── PHP-FPM (Laravel dev stage — includes Xdebug, no nginx) ─────────────────
  app:
    build:
      context: .
      target: development
    volumes:
      # Mount the whole repo so code changes reflect immediately
      - .:/var/www/html
      # Keep vendor inside the container (avoids Windows path issues)
      - vendor:/var/www/html/vendor
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Override CMD to run Laravel's built-in dev server instead of bare php-fpm
    command: php artisan serve --host=0.0.0.0 --port=8000
    networks:
      - voltraak

  # ── Vite dev server ──────────────────────────────────────────────────────────
  vite:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - voltraak

  # ── MySQL 8 ──────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: voltraak_ims
      MYSQL_ROOT_PASSWORD: yourpassword
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pyourpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - voltraak

volumes:
  db_data:
  vendor:
  node_modules:

networks:
  voltraak:
    driver: bridge
