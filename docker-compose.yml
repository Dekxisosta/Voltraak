# Voltraak IMS - Docker Compose Development Environment
version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: voltraak_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: voltraak_ims
      MYSQL_USER: voltraak
      MYSQL_PASSWORD: voltraak_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - voltraak_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: voltraak_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - voltraak_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Laravel Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: voltraak_backend
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: true
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: voltraak_ims
      DB_USERNAME: voltraak
      DB_PASSWORD: voltraak_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    ports:
      - "8000:9000"
    volumes:
      - ./backend:/var/www/html
      - backend_storage:/var/www/html/storage
    networks:
      - voltraak_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: voltraak_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
      VITE_APP_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - voltraak_network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: voltraak_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/sites:/etc/nginx/conf.d
      - ./docker/ssl:/etc/nginx/ssl
    networks:
      - voltraak_network
    depends_on:
      - backend
      - frontend

  # Queue Worker
  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: voltraak_queue
    restart: unless-stopped
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: voltraak_ims
      DB_USERNAME: voltraak
      DB_PASSWORD: voltraak_password
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ./backend:/var/www/html
    networks:
      - voltraak_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--verbose", "--tries=3", "--timeout=90"]

  # Task Scheduler
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: voltraak_scheduler
    restart: unless-stopped
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: voltraak_ims
      DB_USERNAME: voltraak
      DB_PASSWORD: voltraak_password
    volumes:
      - ./backend:/var/www/html
    networks:
      - voltraak_network
    depends_on:
      mysql:
        condition: service_healthy
    command: ["php", "artisan", "schedule:run"]

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  backend_storage:
    driver: local

networks:
  voltraak_network:
    driver: bridge