# Voltraak IMS - Development Environment (No Build Required)
version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: voltraak_mysql_dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: voltraak_ims
      MYSQL_USER: voltraak
      MYSQL_PASSWORD: voltraak_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - voltraak_dev_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: voltraak_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - voltraak_dev_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PHP Development Server (using official PHP image)
  backend:
    image: php:8.2-cli
    container_name: voltraak_backend_dev
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: true
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: voltraak_ims
      DB_USERNAME: voltraak
      DB_PASSWORD: voltraak_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    networks:
      - voltraak_dev_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      bash -c "
        apt-get update && 
        apt-get install -y git zip unzip libzip-dev libpng-dev libonig-dev libxml2-dev mysql-client &&
        docker-php-ext-install pdo_mysql mbstring zip gd xml &&
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer &&
        if [ ! -d 'vendor' ]; then composer install --no-dev; fi &&
        if [ ! -f '.env' ]; then cp .env.example .env; fi &&
        php artisan key:generate &&
        php artisan serve --host=0.0.0.0 --port=8000
      "

  # Node.js Development Server  
  frontend:
    image: node:18-alpine
    container_name: voltraak_frontend_dev
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
      VITE_APP_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - voltraak_dev_network
    command: >
      sh -c "
        if [ ! -d 'node_modules' ]; then npm install; fi &&
        npm run dev -- --host 0.0.0.0
      "

  # Adminer (Database Management UI)
  adminer:
    image: adminer:latest
    container_name: voltraak_adminer_dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - voltraak_dev_network
    depends_on:
      - mysql

volumes:
  mysql_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  voltraak_dev_network:
    driver: bridge