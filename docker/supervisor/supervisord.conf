; ─── Supervisord — manages Nginx + PHP-FPM in a single container ─────────────

[supervisord]
nodaemon            = true
logfile             = /var/log/supervisor/supervisord.log
logfile_maxbytes    = 10MB
logfile_backups     = 3
loglevel            = info
pidfile             = /var/run/supervisord.pid

[unix_http_server]
file = /var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///var/run/supervisor.sock

; ─── Nginx ────────────────────────────────────────────────────────────────────
[program:nginx]
command         = /usr/sbin/nginx -g "daemon off;"
autostart       = true
autorestart     = true
startretries    = 3
stdout_logfile  = /var/log/nginx/access.log
stderr_logfile  = /var/log/nginx/error.log
priority        = 10

; ─── PHP-FPM ─────────────────────────────────────────────────────────────────
[program:php-fpm]
command         = /usr/local/sbin/php-fpm --nodaemonize
autostart       = true
autorestart     = true
startretries    = 3
stdout_logfile  = /var/log/php-fpm/access.log
stderr_logfile  = /var/log/php-fpm/error.log
priority        = 5

; ─── Laravel queue worker (optional — remove if not using queues) ─────────────
[program:queue-worker]
command         = php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart       = true
autorestart     = true
startretries    = 3
numprocs        = 1
stdout_logfile  = /var/log/supervisor/queue-worker.log
stderr_logfile  = /var/log/supervisor/queue-worker-error.log
stopwaitsecs    = 10
priority        = 20
