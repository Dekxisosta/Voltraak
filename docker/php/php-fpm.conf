; ─── PHP-FPM pool configuration ───────────────────────────────────────────────
; Replaces the default www.conf pool.

[www]
user  = www-data
group = www-data

; Listen on TCP (Nginx connects to 127.0.0.1:9000)
listen = 127.0.0.1:9000

; Process management — dynamic scales workers between pm.min_spare_servers
; and pm.max_children based on load.
pm                      = dynamic
pm.max_children         = 20
pm.start_servers        = 4
pm.min_spare_servers    = 2
pm.max_spare_servers    = 8
pm.max_requests         = 500

; Logging
access.log              = /var/log/php-fpm/access.log
slowlog                 = /var/log/php-fpm/slow.log
request_slowlog_timeout = 5s

; Expose FPM status/ping endpoints (Nginx can proxy these for health checks)
pm.status_path  = /fpm-status
ping.path       = /fpm-ping
ping.response   = pong

; Environment — pass through key vars Laravel needs
env[APP_ENV]    = $APP_ENV
env[APP_KEY]    = $APP_KEY
env[APP_DEBUG]  = $APP_DEBUG

; Clear environment before injecting the above (security)
clear_env = no
