server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    charset utf-8;

    # Handle Laravel routes (Inertia SPA — all unknown paths go to index.php)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite-built assets — aggressive cache, content-hashed filenames
    location /build/ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # Static public assets (logo, images, etc.)
    location ~* \.(ico|css|js|gif|jpg|jpeg|png|svg|webp|woff|woff2|ttf|eot)$ {
        expires     30d;
        add_header  Cache-Control "public";
        access_log  off;
        try_files   $uri =404;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass            127.0.0.1:9000;
        fastcgi_index           index.php;
        fastcgi_buffers         16 16k;
        fastcgi_buffer_size     32k;
        fastcgi_param           SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include                 fastcgi_params;

        # Timeouts (match PHP max_execution_time)
        fastcgi_read_timeout    60;
        fastcgi_send_timeout    60;
        fastcgi_connect_timeout 60;
    }

    # Block dotfiles (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Block sensitive files from direct access
    location ~* \.(env|log|yaml|yml|toml|lock|json)$ {
        deny all;
    }

    error_page 404 /index.php;
}
