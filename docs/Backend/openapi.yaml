openapi: 3.0.3
info:
  title: Inventory Management System API
  description: |
    RESTful API for WalangBrownout Appliances Inventory Management System (IMS).
    
    This API provides comprehensive inventory management capabilities including:
    - User management and authentication
    - Product and batch tracking with FEFO support
    - Stock transactions and physical counts
    - Supplier management and procurement workflows
    - Reporting and analytics
    
    ## Authentication
    All endpoints except `/auth/login` require Bearer token authentication using JWT tokens.
    
    ## Status Code Standards
    This API follows RFC 7231 HTTP status code standards with IMS-specific extensions:
    
    ### Success Responses (2xx)
    - **200 OK**: Successful GET, PATCH operations, and POST operations without resource creation
    - **201 Created**: Successful POST operations that create new resources
    - **204 No Content**: Successful DELETE operations
    
    ### Client Error Responses (4xx)
    - **400 Bad Request**: Malformed request syntax or invalid parameters
    - **401 Unauthorized**: Missing or invalid authentication credentials
    - **403 Forbidden**: Valid credentials but insufficient permissions for the operation
    - **404 Not Found**: Requested resource does not exist
    - **405 Method Not Allowed**: HTTP method not supported for the endpoint
    - **409 Conflict**: Business logic conflicts (insufficient inventory, FEFO violations, resource state conflicts)
    - **413 Payload Too Large**: Request payload exceeds size limits
    - **422 Unprocessable Entity**: Validation failures and business rule violations
    
    ### Server Error Responses (5xx)
    - **500 Internal Server Error**: Unexpected server errors
    - **503 Service Unavailable**: Database or external service failures, maintenance mode
    - **504 Gateway Timeout**: Request processing timeout or external service timeout
    
    ## Error Response Format
    All error responses follow a standardized format with error codes for programmatic handling.
    
    ## Business Logic Error Codes
    - `INSUFFICIENT_INVENTORY`: Stock operations exceeding available inventory
    - `FEFO_VIOLATION`: First Expired, First Out rule violations
    - `RESERVATION_CONFLICT`: Resource reservation conflicts
    - `INVALID_RESOURCE_STATE`: Operations on resources in incorrect states
    - `EXPIRED_BATCH_OPERATION`: Operations on expired product batches
    
  version: 1.0.0
  contact:
    name: IMS API Support
    email: api-support@walangbrownout.com
